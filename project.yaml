# ==========================================================================
# CRE PROJECT SETTINGS FILE - ChainGuard Sentinel
# ==========================================================================
# Project-specific settings for ChainGuard smart contract risk monitoring.
# Configures DON family, account ownership, and RPC endpoints.
#
# RPC (required for fast "Writing report on-chain"):
#   CRE project.yaml does NOT expand environment variables. You must replace
#   the literal "YOUR_ALCHEMY_API_KEY" in the URLs below with your actual
#   Alchemy API key (get one at alchemy.com). Use the same key you use in
#   chain-guard .env.local or chain-guard-cre/.env. Without a valid key,
#   the workflow may fall back to slow public RPCs and report writes can take
#   many minutes.

# ==========================================================================
local-simulation:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://eth-sepolia.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY
    - chain-name: ethereum-mainnet
      url: https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY

# ==========================================================================
staging:
  cre-cli:
    don-family: "zone-a"
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://eth-sepolia.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY
    - chain-name: ethereum-mainnet
      url: https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY

# ==========================================================================
# EVM-triggered workflow: request from consumer -> CRE runs -> writes report onchain
# (Sepolia RPC is used for writeReport — must be a valid Alchemy URL or writes take 30+ min)
evm-triggered:
  rpcs:
    - chain-name: ethereum-testnet-sepolia
      url: https://eth-sepolia.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY
    - chain-name: ethereum-mainnet
      url: https://eth-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_API_KEY

# ==========================================================================
production:
  cre-cli:
    don-family: "zone-a"
  rpcs:
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
    - chain-name: polygon-mainnet
      url: https://polygon-bor-rpc.publicnode.com
